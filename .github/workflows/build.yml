name: Сборка APK Джарвиса

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Сборка
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Переименование
        run: cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Публикация для скачивания на телефон
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Джарвис, сборка ${{ github.run_number }}
          body: Скачайте Jarvis.apk на телефон и установите.
          make_latest: true
          files: Jarvis.apk
