name: Сборка APK Джарвиса

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Голос Джарвиса и библиотека синтеза речи
        run: |
          set -e
          mkdir -p app/libs app/src/main/assets/ruslan
          for v in 1.13.8 1.13.7 1.13.6 1.13.5 1.13.4 1.13.3 1.13.2 1.13.1 1.13.0 1.12.15 1.12.14 1.12.13; do
            if curl -fsSL -o app/libs/sherpa-onnx.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$v/sherpa-onnx-$v.aar"; then
              echo "sherpa-onnx $v"; break
            fi
          done
          test -s app/libs/sherpa-onnx.aar
          curl -fsSL -o voice.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ru_RU-ruslan-medium-int8.tar.bz2"
          tar xjf voice.tar.bz2
          d=vits-piper-ru_RU-ruslan-medium-int8
          ls -la "$d"
          cp "$(ls "$d"/*.onnx | head -n 1)" app/src/main/assets/ruslan/model.onnx
          cp "$d/tokens.txt" app/src/main/assets/ruslan/tokens.txt
          cp -r "$d/espeak-ng-data" app/src/main/assets/ruslan/
          du -sh app/src/main/assets/ruslan

      - name: Детектор слова «Джарвис»
        run: |
          set -e
          mkdir -p app/src/main/assets/wakeword
          curl -fsSL -o kws.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2"
          tar xjf kws.tar.bz2
          k=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          ls -la "$k"
          cp "$k/encoder-epoch-12-avg-2-chunk-16-left-64.onnx" app/src/main/assets/wakeword/encoder.onnx
          cp "$k/decoder-epoch-12-avg-2-chunk-16-left-64.onnx" app/src/main/assets/wakeword/decoder.onnx
          cp "$k/joiner-epoch-12-avg-2-chunk-16-left-64.onnx" app/src/main/assets/wakeword/joiner.onnx
          cp "$k/tokens.txt" app/src/main/assets/wakeword/tokens.txt
          pip install -q sherpa-onnx sentencepiece
          printf 'JARVIS :2.0 #0.15 @JARVIS\nJERVIS :2.0 #0.15 @JARVIS\nJARVES :2.0 #0.15 @JARVIS\nHEY JARVIS :2.0 #0.2 @JARVIS\n' > keywords_raw.txt
          sherpa-onnx-cli text2token --tokens "$k/tokens.txt" --tokens-type bpe --bpe-model "$k/bpe.model" keywords_raw.txt app/src/main/assets/wakeword/keywords.txt
          cat app/src/main/assets/wakeword/keywords.txt

      - name: Сборка
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Переименование
        run: cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Публикация для скачивания на телефон
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Джарвис, сборка ${{ github.run_number }}
          body: Скачайте Jarvis.apk на телефон и установите.
          make_latest: true
          files: Jarvis.apk
